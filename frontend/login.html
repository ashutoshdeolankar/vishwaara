<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishwaara | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #0d3b36;
            --primary-light: #17584f;
            --accent: #e58f3f;
            --dark: #172321;
            --text: #596663;
            --border: #e4e9e6;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--dark);
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 34px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .brand {
            font-weight: 700;
            font-size: 26px;
            color: var(--primary);
            text-decoration: none;
        }

        .brand span { color: var(--accent); }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin: 22px 0;
            background: #f1f4f2;
            padding: 5px;
            border-radius: 14px;
        }

        .auth-tabs button {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            color: var(--text);
        }

        .auth-tabs button.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-label { font-weight: 600; font-size: 14px; }

        .form-control {
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .btn-main {
            width: 100%;
            border: 0;
            border-radius: 30px;
            padding: 13px;
            font-weight: 600;
            color: white;
            background: var(--primary);
        }

        .btn-main:hover { background: var(--primary-light); }
        .btn-main:disabled { opacity: 0.6; }

        #message {
            display: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 14px;
        }

        #message.error { display: block; background: #fdecea; color: #922b21; }
        #message.ok { display: block; background: #e6f4ea; color: #1e6b34; }

        .hint { font-size: 13px; color: var(--text); }
        .back { display: block; text-align: center; margin-top: 18px; font-size: 14px; }
    </style>
</head>
<body>

<div class="auth-card">

    <a class="brand" href="index.html">
        <i class="bi bi-compass"></i> Vishwa<span>ara</span>
    </a>

    <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Log in</button>
        <button type="button" id="tabSignup">Sign up</button>
    </div>

    <div id="message"></div>

    <!-- LOGIN -->
    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input class="form-control" type="email" id="loginEmail" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="loginPassword">Password</label>
            <input class="form-control" type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <div class="mb-4" id="loginHuman">
            <div id="loginRecaptcha" style="display:none"></div>
            <div id="loginMathBox">
            <label class="form-label" for="loginCaptchaAnswer" id="loginCaptchaQuestion">Human check</label>
            <input class="form-control" type="text" inputmode="numeric" id="loginCaptchaAnswer" autocomplete="off" placeholder="Type the answer" required>
            <a href="#" class="hint refresh-captcha" data-form="login">Show a different question</a>
            </div>
        </div>
        <button class="btn-main" type="submit" id="loginButton">Log in</button>
    </form>

    <!-- SIGN UP -->
    <form id="codeForm" novalidate style="display: none;">
        <p class="hint" id="codeInfo">We emailed a 6-digit code to you.</p>
        <div class="mb-4">
            <label class="form-label" for="codeInput">6-digit code</label>
            <input class="form-control" type="text" inputmode="numeric" id="codeInput" maxlength="6" autocomplete="one-time-code" placeholder="123456" required>
            <a href="#" class="hint" id="resendCode">Send the code again</a>
        </div>
        <button class="btn-main" type="submit" id="codeButton">Verify and continue</button>
    </form>

    <form id="signupForm" novalidate style="display: none;">
        <div class="mb-3">
            <label class="form-label" for="signupName">Your name</label>
            <input class="form-control" type="text" id="signupName" autocomplete="name" maxlength="100" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupEmail">Email</label>
            <input class="form-control" type="email" id="signupEmail" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupPassword">Password</label>
            <input class="form-control" type="password" id="signupPassword" autocomplete="new-password" minlength="8" required>
            <div class="hint mt-1">At least 8 characters.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupCity">Home city (optional)</label>
            <input class="form-control" type="text" id="signupCity" maxlength="100" placeholder="Example: Pune">
            <div class="hint mt-1">We use it to fill in your starting city.</div>
        </div>
        <div class="mb-4" id="signupHuman">
            <div id="signupRecaptcha" style="display:none"></div>
            <div id="signupMathBox">
            <label class="form-label" for="signupCaptchaAnswer" id="signupCaptchaQuestion">Human check</label>
            <input class="form-control" type="text" inputmode="numeric" id="signupCaptchaAnswer" autocomplete="off" placeholder="Type the answer" required>
            <a href="#" class="hint refresh-captcha" data-form="signup">Show a different question</a>
            </div>
        </div>
        <button class="btn-main" type="submit" id="signupButton">Create account</button>
    </form>

    <a class="back" href="index.html">&larr; Back to Vishwaara</a>

</div>

<script src="auth.js"></script>
<script>

const params = new URLSearchParams(window.location.search);
const nextPage = TravelPalAuth.safeNext(params.get("next"));

if (TravelPalAuth.isLoggedIn()) {
    window.location.replace(nextPage);
}

const messageBox = document.getElementById("message");

function showMessage(text, kind) {
    messageBox.textContent = text;
    messageBox.className = kind;
}

const captchaTokens = { login: "", signup: "" };
const captchaProvider = { login: "math", signup: "math" };
const recaptchaWidgets = {};
let recaptchaScript = null;

function loadRecaptchaScript() {
    if (!recaptchaScript) {
        recaptchaScript = new Promise((resolve, reject) => {
            const tag = document.createElement("script");
            tag.src = "https://www.google.com/recaptcha/api.js?render=explicit";
            tag.async = true;
            tag.onload = () => window.grecaptcha.ready(resolve);
            tag.onerror = () => {
                recaptchaScript = null;
                reject(new Error("Could not load Google reCAPTCHA. Check your internet."));
            };
            document.head.appendChild(tag);
        });
    }
    return recaptchaScript;
}

function showMathBox(form, show) {
    document.getElementById(form + "MathBox").style.display = show ? "block" : "none";
    document.getElementById(form + "Recaptcha").style.display = show ? "none" : "block";
    /* a hidden required box would stop the form from sending */
    document.getElementById(form + "CaptchaAnswer").required = show;
}

async function loadCaptcha(form) {
    const label = document.getElementById(form + "CaptchaQuestion");
    document.getElementById(form + "CaptchaAnswer").value = "";
    label.textContent = "Loading the human check...";
    try {
        const data = await TravelPalAuth.getCaptcha();
        captchaProvider[form] = data.provider;
        if (data.provider === "recaptcha") {
            showMathBox(form, false);
            await loadRecaptchaScript();
            if (recaptchaWidgets[form] === undefined) {
                recaptchaWidgets[form] = window.grecaptcha.render(form + "Recaptcha", {
                    sitekey: data.site_key
                });
            } else {
                window.grecaptcha.reset(recaptchaWidgets[form]);   /* a tick works only once */
            }
            return;
        }
        showMathBox(form, true);
        captchaTokens[form] = data.token;
        label.textContent = "Human check: " + data.question;
    } catch (error) {
        captchaTokens[form] = "";
        showMathBox(form, true);
        label.textContent = "Could not load the human check. Is Docker running?";
    }
}

function captchaFor(form) {
    if (captchaProvider[form] === "recaptcha") {
        const token = window.grecaptcha.getResponse(recaptchaWidgets[form]);
        if (!token) {
            throw new Error("Please tick \"I'm not a robot\".");
        }
        return { token: token, answer: "" };
    }
    const answer = document.getElementById(form + "CaptchaAnswer").value.trim();
    if (!answer) {
        throw new Error("Please answer the human check.");
    }
    return { token: captchaTokens[form], answer: answer };
}

document.querySelectorAll(".refresh-captcha").forEach(link => {
    link.addEventListener("click", event => {
        event.preventDefault();
        loadCaptcha(link.dataset.form);
    });
});

function showTab(name) {
    const login = name === "login";
    document.getElementById("codeForm").style.display = "none";
    document.getElementById("loginForm").style.display = login ? "block" : "none";
    document.getElementById("signupForm").style.display = login ? "none" : "block";
    document.getElementById("tabLogin").classList.toggle("active", login);
    document.getElementById("tabSignup").classList.toggle("active", !login);
    messageBox.className = "";
    loadCaptcha(login ? "login" : "signup");
}

let pendingEmail = "";

function showCodeForm(email) {
    pendingEmail = email;
    ["loginForm", "signupForm"].forEach(id => {
        document.getElementById(id).style.display = "none";
    });
    document.getElementById("codeForm").style.display = "block";
    document.getElementById("codeInfo").textContent =
        "We emailed a 6-digit code to " + email + ". It works for 10 minutes. Check Spam too.";
    document.getElementById("codeInput").value = "";
    document.getElementById("codeInput").focus();
    showMessage("Code sent. Please check your email.", "ok");
}

document.getElementById("codeForm").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("codeButton");
    const code = document.getElementById("codeInput").value.trim();
    if (!/^\d{6}$/.test(code)) {
        showMessage("Type the 6 digits from the email.", "error");
        return;
    }
    button.disabled = true;
    try {
        await TravelPalAuth.verifyCode(pendingEmail, code);
        showMessage("Done! Taking you back...", "ok");
        window.location.href = nextPage;
    } catch (error) {
        showMessage(error.message, "error");
        button.disabled = false;
    }
});

document.getElementById("resendCode").addEventListener("click", async event => {
    event.preventDefault();
    try {
        await TravelPalAuth.resendCode(pendingEmail);
        showMessage("If the last code is older than 30 seconds, a new one was sent.", "ok");
    } catch (error) {
        showMessage(error.message, "error");
    }
});

document.getElementById("tabLogin").addEventListener("click", () => showTab("login"));
document.getElementById("tabSignup").addEventListener("click", () => showTab("signup"));

async function submitForm(event, form, button, action) {
    event.preventDefault();
    messageBox.className = "";
    button.disabled = true;
    const label = button.textContent;
    button.textContent = "Please wait...";
    try {
        const result = await action();
        if (result && result.needsCode) {
            button.disabled = false;
            button.textContent = label;
            showCodeForm(result.email);
            return;
        }
        showMessage("Done! Taking you back...", "ok");
        window.location.href = nextPage;
    } catch (error) {
        showMessage(error.message, "error");
        button.disabled = false;
        button.textContent = label;
        loadCaptcha(form);   /* each question works only once */
    }
}

document.getElementById("loginForm").addEventListener("submit", event => {
    submitForm(event, "login", document.getElementById("loginButton"), () => {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        if (!email || !password) {
            throw new Error("Enter your email and password.");
        }
        return TravelPalAuth.login(email, password, captchaFor("login"));
    });
});

document.getElementById("signupForm").addEventListener("submit", event => {
    submitForm(event, "signup", document.getElementById("signupButton"), () => {
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        const city = document.getElementById("signupCity").value.trim();
        if (!name || !email || !password) {
            throw new Error("Please fill in your name, email and password.");
        }
        if (password.length < 8) {
            throw new Error("Password must be at least 8 characters.");
        }
        return TravelPalAuth.register(name, email, password, city, captchaFor("signup"));
    });
});

if (params.get("tab") === "signup") {
    showTab("signup");
} else {
    loadCaptcha("login");
}

</script>
</body>
</html>
